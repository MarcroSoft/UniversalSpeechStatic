name: build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      # Versionen staar i ci/w64devkit.env, ikke her. Den fil spejler
      # MTC's ci/versions.env, og MTC's CI fejler, hvis de skrider fra
      # hinanden - se kommentaren i filen.
      - name: Laes pinnet toolchain
        shell: pwsh
        run: |
          Get-Content ci/w64devkit.env |
            Where-Object { $_ -match '^[A-Z0-9_]+=' } |
            ForEach-Object { $_ | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8 }

      - name: Cache w64devkit
        id: cache-devkit
        uses: actions/cache@v6
        with:
          path: C:\w64devkit
          key: w64devkit-i686-${{ hashFiles('ci/w64devkit.env') }}

      - name: Hent w64devkit (i686 / 32-bit)
        if: steps.cache-devkit.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ver = $env:W64DEVKIT_VERSION
          $url = "https://github.com/skeeto/w64devkit/releases/download/v$ver/w64devkit-x86-$ver.7z.exe"
          Write-Host "henter $url"
          curl.exe -sSL -o "$env:RUNNER_TEMP\devkit.7z" $url
          $got = (Get-FileHash "$env:RUNNER_TEMP\devkit.7z" -Algorithm SHA256).Hash.ToLower()
          if ($got -ne $env:W64DEVKIT_SHA256) {
            throw "sha256 stemmer ikke: forventet $env:W64DEVKIT_SHA256, faktisk $got"
          }
          7z x -y -oC:\ "$env:RUNNER_TEMP\devkit.7z" | Out-Null
          & C:\w64devkit\bin\gcc.exe -dumpmachine

      # Bygget skal vaere HELT tavst. Makefilen koerer -Wall -Wextra, og
      # alle advarsler er rettet i koden (paa naer -Wunused-parameter, som
      # er slaaet fra med begrundelse i makefilen). Dukker der en ny op,
      # skal den fanges her - ikke foerst naar MTC bygger kaeden.
      - name: Byg og kraev nul advarsler
        shell: pwsh
        run: |
          & C:\w64devkit\bin\sh.exe -c "export PATH='C:/w64devkit/bin;C:/Windows/system32;C:/Windows'; make clean >/dev/null 2>&1; make" > build.log 2>&1
          $code = $LASTEXITCODE
          Get-Content build.log
          if ($code -ne 0) { throw "make fejlede (exit $code)" }
          $w = Select-String -Path build.log -Pattern "warning:"
          if ($w) {
            Write-Host "::error::Bygget gav $($w.Count) advarsel(er) - forken skal bygge tavst"
            $w | ForEach-Object { Write-Host $_.Line }
            exit 1
          }
          Write-Host "0 advarsler"

      - name: Vis at arkivet er i686
        shell: pwsh
        run: |
          & C:\w64devkit\bin\objdump.exe -f libUniversalSpeechStatic.a |
            Select-String -Pattern "file format" | Select-Object -First 3
          Get-Item libUniversalSpeechStatic.a | Select-Object Name, Length

      - uses: actions/upload-artifact@v7
        with:
          name: libUniversalSpeechStatic-i686
          path: libUniversalSpeechStatic.a
          if-no-files-found: error
